{% extends 'acervo/base.html' %}

{% block conteudo %}
<ul>
    {% for l in lista %}

    <li>
        {{ l.nome }}
        <br>
        <br>
        <br>
        {{ l.autor }}
        <br>
        <br>
        <br>
        {{ l.descricao }}
        <br>
        <br>
        <br>
        {{ l.categorias }}
        <br>
        <br>
        <br>
        {{ l.tipo }}
    </li>
    {% empty %}
    <h2>Sem livros</h2>
    {% endfor %}
</ul>
{% endblock %}
